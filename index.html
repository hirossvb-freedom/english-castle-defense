function character(u,enemy,t){let x=u.x,y=307-(u.jump||0),r=u.boss?38:23,bob=Math.sin(t*10+u.x*.03)*2;c.save();c.translate(x,y+bob);ellipse(0,5,r,5,'#547f7240');if(!enemy&&g.awTime>0){c.shadowColor='#f4c44a';c.shadowBlur=25;c.strokeStyle='#f9cc55';c.lineWidth=5;c.beginPath();c.arc(0,-r,r+8,0,Math.PI*2);c.stroke()}let color=enemy?(u.boss?'#8ebd68':'#93d87e'):['#7ed3fa','#67bff2','#a3e7ff'][u.idx];ellipse(-r*.55,-4,8,6,color);ellipse(r*.55,-4,8,6,color);c.fillStyle=color;c.strokeStyle=enemy?'#5a9b51':'#3d9dd0';c.lineWidth=3;c.beginPath();c.ellipse(0,-r,r,r*.95,0,0,Math.PI*2);c.fill();c.stroke();c.shadowBlur=0;ellipse(-r*.5,-r*.6,7,5,enemy?'#b9e9a8':'#ffb4bf');ellipse(r*.5,-r*.6,7,5,enemy?'#b9e9a8':'#ffb4bf');ellipse(-8,-r-5,4,5,'#294353');ellipse(8,-r-5,4,5,'#294353');ellipse(-9,-r-7,1.5,2,'white');ellipse(7,-r-7,1.5,2,'white');c.strokeStyle='#34536a';c.lineWidth=2;c.beginPath();c.arc(0,-r+4,5,0,Math.PI);c.stroke();c.font='23px system-ui';if(!enemy){let s=d.slots[u.idx],w=findItem(s.weapon),shield=findItem(s.shield);if(findItem(s.helmet)){c.fillStyle='#a1b9d4';c.fillRect(-16,-r*2-5,32,9)}if(findItem(s.chest)){c.strokeStyle='#93abc6';c.lineWidth=5;c.beginPath();c.arc(0,-r+5,12,.2,Math.PI-.2);c.stroke()}if(shield)ellipse(-r-3,-r+8,12,16,'#e7b660');let symbol=w?({'剣':'⚔️','槍':'🔱','斧':'🪓','ハンマー':'🔨','弓':'🏹','魔法の杖':'🪄'}[w.name]||'⚔️'):'⚔️';c.fillText(symbol,r-3,-r+8-(u.swing>0?10:0));if(u.swing>0){c.strokeStyle='#ffdc79';c.lineWidth=5;c.beginPath();c.arc(r+8,-r,26,-1.2,.6);c.stroke()}}else{if(u.boss)c.fillText('👑',-16,-r*2-12);else if(u.type==='archer')c.fillText('🏹',-r-13,-r+4);else if(u.type==='mage')c.fillText('🪄',-r-13,-r+4);else if(u.type==='sword')c.fillText('⚔️',-r-13,-r+4)}c.restore();if(!u.boss)bar(x-25,y-r*2-22,50,u.hp/u.max,enemy?'#eb6172':'#4598ee');if(!enemy&&selected===u.id){c.strokeStyle='#f8c548';c.lineWidth=4;c.beginPath();c.arc(x,y-r,32,0,Math.PI*2);c.stroke()}}
